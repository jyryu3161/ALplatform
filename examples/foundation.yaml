# Python >=3.11; install extras nori,tabldm,tabfm before running.
# Public weights download on first use. TabFM weights: non-commercial, non-production only.
# Run: active-learning-docking run --config examples/foundation.yaml
schema_version: 1
seed: 42
mode: replay
output_dir: ../results/foundation
resources:
  cpu_threads: 2
  device: cpu  # cuda:0 for larger context and faster inference
data:
  path: replay.csv
  score_column: synthetic_score
  fingerprint_bits: 128
model:
  models: [tabpfn, nori, tabldm, tabfm]
  ensemble: {strategy: mean}
  params:
    nori: {model: nori-6m, max_features: 32, max_context_samples: 256}
    tabldm: {n_estimators: 2, max_features: 32, max_context_samples: 256}
    tabfm: {n_estimators: 2, max_features: 32, max_context_samples: 256}
  batch_size: 16
  inference_batch_size: 32
learning:
  initial_size: 8
  batch_size: 4
  cycles: 1
  budget: 12
  strategy: lcb
evaluation:
  holdout_fraction: 0.2
  top_k: 4
