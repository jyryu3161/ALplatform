schema_version: 1
seed: 42
mode: replay
output_dir: ../results/replay
resources:
  cpu_threads: 2
  gpu_ids: [0, 1]
  device: cpu
  deterministic: true
data:
  path: replay.csv
  score_column: synthetic_score
  fingerprint_bits: 256
model:
  batch_size: 16
learning:
  initial_size: 8
  batch_size: 4
  cycles: 3
  budget: 20
  strategy: lcb
  beta: 1.0
evaluation:
  holdout_fraction: 0.2
  split: random
  top_k: 4
