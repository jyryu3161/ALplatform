name: active-learning-docking
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  # Python and core ML frameworks
  - python=3.9
  
  # PyTorch CPU-only version
  - pytorch>=1.13.0
  - torchvision
  - torchaudio
  - cpuonly  # Forces CPU-only installation
  
  # Scientific computing (stable versions)
  - numpy=1.24.3
  - pandas=2.0.3
  - scipy=1.10.1
  - scikit-learn=1.3.0
  
  # Chemistry and molecular modeling
  - rdkit=2023.03.3
  
  # Molecular docking (optional - qVina2.1이 20배 빠름)
  - qvina
  
  # Machine learning and optimization
  - optuna=3.2.0
  - joblib=1.3.0
  
  # Data processing and visualization
  - tqdm=4.65.0
  - matplotlib=3.7.2
  - seaborn=0.12.2
  
  # System utilities
  - psutil=5.9.0
  
  # Configuration and file handling
  - pyyaml=6.0.1
  - jsonschema=4.17.3
  
  # Additional utilities
  - pip=23.1.2
  
  # pip packages (for packages not available in conda)
  - pip:
    - oddt==0.7
    - biopython==1.81
    - vina==1.2.7

# Post-installation notes:
# 1. This environment is for CPU-only systems without CUDA
# 2. Performance will be slower than GPU version for neural network training
# 3. Run test_installation.py after setup to verify installation
# 4. Configure qvina2.1 binary path in config.yml
# 5. Ensure proper permissions for molecular docking executables