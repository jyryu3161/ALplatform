name: active-learning-docking
channels:
  - conda-forge
  - pytorch
  - rdkit
  - defaults
dependencies:
  - python=3.9
  - pytorch>=1.11.0
  - torchvision
  - torchaudio
  # - cpuonly  # Remove this line if you need CUDA support
  
  # Scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0
  
  # Chemistry and molecular modeling
  - rdkit>=2022.03
  
  # Machine learning and optimization
  - optuna>=2.10.0
  - joblib>=1.1.0
  
  # Data processing and visualization
  - tqdm>=4.62.0
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  
  # System monitoring
  - psutil>=5.8.0
  
  # Configuration and file handling
  - pyyaml>=6.0
  - jsonschema>=4.0.0
  
  # Molecular docking dependencies
  - pip
  - pip:
    - oddt>=0.7.0
    - biopython>=1.79
    - autodock-vina>=1.2.0
    
  # Development and testing (optional)
  - pytest>=6.2.0
  - black>=21.0.0
  - flake8>=3.9.0
  - mypy>=0.910
  
# CUDA version (uncomment if GPU support is needed)
# For CUDA 11.6:
# - pytorch-cuda=11.6

# Post-installation notes:
# 1. Install AutoDock Vina binary manually if not available via pip
# 2. Configure qvina2.1 binary path in config.yml
# 3. Ensure proper permissions for molecular docking executables