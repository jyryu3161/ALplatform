schema_version: 1
seed: 42
mode: replay
output_dir: results/autotune
resources:
  cpu_threads: 2
  gpu_ids: [0, 1]
  device: cpu
  deterministic: true
data:
  path: examples/replay.csv
  score_column: synthetic_score
  fingerprint_bits: 256
model:
  models: [tabm]  # auto_tune tunes TabM only
  n_blocks: 2
  d_block: 32
  k: 4
  epochs: 12
  auto_tune: true
  tuning_method: random
  n_trials: 3
  patience: 4
  batch_size: 16
learning:
  initial_size: 8
  batch_size: 4
  cycles: 3
  budget: 20
  strategy: lcb
  beta: 1.0
evaluation:
  holdout_fraction: 0.2
  split: random
  top_k: 4
