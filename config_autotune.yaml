# ==================================================
# 하이퍼파라미터 자동 튜닝 설정 파일
# ==================================================
# 이 설정은 Optuna 기반 하이퍼파라미터 자동 튜닝을 사용합니다.
# 최적의 성능을 위해 더 많은 에폭과 사이클을 사용합니다.
#
# 사용법:
#   python main.py --config config_autotune.yaml
#
# 주의:
#   - 자동 튜닝은 계산 시간이 더 소요됩니다
#   - GPU 사용 시 더 빠른 성능을 얻을 수 있습니다

# ==================================================
# 필수 파라미터
# ==================================================
output_dir: "results_tuned"
ligand: "inputs/reference.pdb"
protein: "inputs/protein.pdb"
database: "inputs/csvs/"  # 디렉터리 사용 예제

# ==================================================
# 하이퍼파라미터 튜닝 옵션 (핵심!)
# ==================================================
auto_tune: true
  # 자동 튜닝 활성화
  # Optuna가 learning_rate, dropout, embed_dim, weight_decay를 자동 최적화

tuning_method: "random"
  # 튜닝 방법: "random" 또는 "grid"
  # random: 랜덤 서치 (빠르고 효율적, 권장)
  # grid: 그리드 서치 (철저하지만 느림)

# ==================================================
# Active Learning 파라미터
# ==================================================
batch_size: 20
  # 자동 튜닝 시 더 많은 샘플로 안정적인 학습

n_cycles: 15
  # 더 많은 사이클로 충분한 데이터 수집

similarity: 0.25
  # 약간 더 엄격한 유사도 기준

hbond_similarity: 0.35
rmsd_threshold: 2.0
budget: 150000

# ==================================================
# 신경망 파라미터 (초기값, 자동 튜닝됨)
# ==================================================
epochs: 150
  # 자동 튜닝 시 더 많은 에폭으로 수렴 보장

learning_rate: 0.001
  # 초기값 (Optuna가 1e-5 ~ 1e-2 범위에서 최적값 탐색)

dropout: 0.3
  # 초기값 (Optuna가 0.2 ~ 0.7 범위에서 최적값 탐색)

batch_size_nn: 256
mc_dropout_samples: 50

# ==================================================
# Exploration 전략
# ==================================================
initial_exploration_ratio: 0.8
final_exploration_ratio: 0.2

# ==================================================
# 시스템 설정
# ==================================================
max_threads: 16
  # 자동 튜닝 시 더 많은 스레드 활용

# ==================================================
# 예상 실행 시간
# ==================================================
# 자동 튜닝으로 인해 일반 실행 대비 약 2-3배 시간 소요
# 그러나 최적화된 하이퍼파라미터로 더 좋은 성능 달성
#
# 예상:
#   - 소규모 데이터셋 (~10k 화합물): 2-4시간
#   - 중규모 데이터셋 (~100k 화합물): 6-12시간
#   - 대규모 데이터셋 (~1M 화합물): 24시간+
#
# GPU 사용 시 약 3-5배 빠름
