# Active Learning for Molecular Docking - Configuration File
# 이 파일은 main.py의 --config 옵션으로 사용할 수 있습니다.

# ===== 필수 매개변수 =====
output_dir: "results"
ligand: "inputs/reference.pdb"
protein: "inputs/protein.pdb"
database: "inputs/candidates.csv"

# ===== Active Learning 매개변수 =====
initial_csv: null
similarity: 0.2
hbond_similarity: 0.3
budget: 100000
batch_size: 10
n_cycles: 10
conf_num: 1

# ===== 튜닝 옵션 =====
auto_tune: false
tuning_method: "random"

# ===== TabM (Deep Learning) 매개변수 =====
learning_rate: 0.001
dropout: 0.2
epochs: 100
batch_size_nn: 256
mc_dropout_samples: 50

# ===== 시스템 설정 =====
max_threads: 8
disable_element_filter: false
disable_deduplication: false

# ===== Exploration 매개변수 =====
initial_exploration_ratio: 0.8
final_exploration_ratio: 0.2