# ==================================================
# 기본 Active Learning 설정 파일
# ==================================================
# 이 파일은 필수 파라미터와 기본적인 설정만 포함합니다.
#
# 사용법:
#   python main.py --config config_basic.yaml
#
# 특정 값을 명령행에서 오버라이드:
#   python main.py --config config_basic.yaml --epochs 200

# ==================================================
# 필수 파라미터 (반드시 설정해야 함)
# ==================================================
output_dir: "results"
ligand: "inputs/reference.pdb"
protein: "inputs/protein.pdb"
database: "inputs/candidates.csv"  # CSV 파일 또는 디렉터리 경로

# ==================================================
# Active Learning 파라미터
# ==================================================
batch_size: 10           # 사이클당 선택할 화합물 수
n_cycles: 10             # Active Learning 사이클 수
similarity: 0.2          # 분자 유사도 임계값 (0.0 ~ 1.0)
hbond_similarity: 0.3    # H-bond 유사도 임계값
rmsd_threshold: 2.0      # RMSD 임계값 (Angstrom)
budget: 100000           # 총 평가할 화합물 예산

# ==================================================
# 신경망 파라미터
# ==================================================
epochs: 100              # 훈련 에폭 수
learning_rate: 0.001     # 학습률
dropout: 0.2             # 드롭아웃 비율
batch_size_nn: 256       # 신경망 배치 크기
mc_dropout_samples: 50   # 몬테카를로 드롭아웃 샘플 수

# ==================================================
# 시스템 설정
# ==================================================
max_threads: 8           # 최대 CPU 스레드 수
