schema_version: 1
seed: 42
mode: replay
output_dir: results/basic
resources:
  cpu_threads: 2
  gpu_ids: [0, 1]
  device: cpu
  deterministic: true
data:
  path: examples/replay.csv
  score_column: synthetic_score
  fingerprint_bits: 256
model:
  models: [tabpfn]  # tabpfn (default), tabm (tamb alias), random_forest, extra_trees, nori, tabldm, tabfm
  batch_size: 16
learning:
  initial_size: 8
  batch_size: 4
  cycles: 3
  budget: 20
  strategy: lcb
  beta: 1.0
evaluation:
  holdout_fraction: 0.2
  split: random
  top_k: 4
