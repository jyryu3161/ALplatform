# ==================================================
# 전체 파라미터 Active Learning 설정 파일
# ==================================================
# 이 파일은 사용 가능한 모든 파라미터를 포함합니다.
# 각 파라미터에 대한 상세한 설명이 주석으로 제공됩니다.
#
# 사용법:
#   python main.py --config config_full.yaml

# ==================================================
# 필수 파라미터
# ==================================================
output_dir: "results"
  # 설명: 결과를 저장할 디렉터리 경로
  # 출력: final_results.csv, cycle_*/, pose/, models/, active_learning.log

ligand: "inputs/reference.pdb"
  # 설명: 기준 리간드 PDB 파일 경로
  # 용도: RMSD 계산 및 분자 유사도 기준

protein: "inputs/protein.pdb"
  # 설명: 타겟 단백질 PDB 파일 경로
  # 용도: 분자 도킹 시뮬레이션 타겟

database: "inputs/candidates.csv"
  # 설명: 화학 데이터베이스 (CSV 파일 또는 디렉터리)
  # 형식: 'Catalog ID', 'smiles' 컬럼 필수
  # 예제 1 (파일): "inputs/library.csv"
  # 예제 2 (디렉터리): "inputs/csvs/" - 디렉터리 내 모든 CSV 자동 병합

# ==================================================
# Active Learning 파라미터
# ==================================================
initial_csv: null
  # 설명: 초기 훈련 세트 CSV 파일 (선택사항)
  # 용도: 특정 화합물로 훈련 시작 시 사용
  # 예제: "inputs/initial_compounds.csv"

batch_size: 10
  # 설명: 각 사이클에서 선택할 화합물 수
  # 범위: 1 ~ 수백 (데이터 크기에 따라)
  # 권장: 10-50

n_cycles: 10
  # 설명: Active Learning 사이클 수
  # 범위: 1 ~ 무제한
  # 권장: 10-20

budget: 100000
  # 설명: 총 평가할 화합물 예산
  # 용도: 전체 실험 규모 제한
  # 참고: 실제 평가는 사이클 * batch_size

similarity: 0.2
  # 설명: 분자 유사도 임계값 (Tanimoto coefficient)
  # 범위: 0.0 (완전 비유사) ~ 1.0 (완전 유사)
  # 권장: 0.2-0.4

hbond_similarity: 0.3
  # 설명: 수소 결합 패턴 유사도 임계값
  # 범위: 0.0 ~ 1.0
  # 권장: 0.3-0.5

rmsd_threshold: 2.0
  # 설명: RMSD (Root Mean Square Deviation) 임계값 (Angstrom)
  # 범위: 0.0 ~ 무제한
  # 권장: 1.5-3.0
  # 의미: 기준 리간드와의 결합 포즈 유사도

conf_num: 1
  # 설명: 분자당 생성할 conformer 수
  # 범위: 1 ~ 10+
  # 권장: 1-3 (계산 시간 고려)

# ==================================================
# Exploration 전략 파라미터
# ==================================================
initial_exploration_ratio: 0.8
  # 설명: 초기 사이클의 exploration 비율
  # 범위: 0.0 (exploitation만) ~ 1.0 (exploration만)
  # 권장: 0.7-0.9

final_exploration_ratio: 0.2
  # 설명: 최종 사이클의 exploration 비율
  # 범위: 0.0 ~ 1.0
  # 권장: 0.1-0.3
  # 참고: 사이클이 진행되며 선형으로 감소

# ==================================================
# TabM 신경망 파라미터
# ==================================================
learning_rate: 0.001
  # 설명: Adam optimizer 학습률
  # 범위: 1e-5 ~ 1e-2
  # 권장: 0.0001 ~ 0.01

dropout: 0.2
  # 설명: 드롭아웃 비율 (정규화)
  # 범위: 0.0 ~ 0.7
  # 권장: 0.1-0.3

epochs: 100
  # 설명: 각 사이클의 훈련 에폭 수
  # 범위: 10 ~ 1000+
  # 권장: 50-200

batch_size_nn: 256
  # 설명: 신경망 훈련 배치 크기
  # 범위: 32 ~ 1024
  # 권장: 128-512 (GPU 메모리 고려)

mc_dropout_samples: 50
  # 설명: 몬테카를로 드롭아웃 샘플 수 (불확실성 추정)
  # 범위: 10 ~ 200
  # 권장: 30-100

# ==================================================
# 하이퍼파라미터 튜닝
# ==================================================
auto_tune: false
  # 설명: 자동 하이퍼파라미터 튜닝 활성화
  # 옵션: true / false
  # 참고: true 시 계산 시간 증가하지만 성능 향상

tuning_method: "random"
  # 설명: 튜닝 방법
  # 옵션: "random" (랜덤 서치) / "grid" (그리드 서치)
  # 권장: "random" (빠르고 효율적)

# ==================================================
# 시스템 설정
# ==================================================
max_threads: 8
  # 설명: 최대 CPU 스레드 수
  # 범위: 1 ~ CPU 코어 수
  # 권장: 4-16

disable_element_filter: false
  # 설명: 원소 필터링 비활성화
  # 옵션: true / false
  # 참고: false 권장 (도킹 호환성)

disable_deduplication: false
  # 설명: SMILES 중복 제거 비활성화
  # 옵션: true / false
  # 참고: false 권장 (메모리 및 성능)
