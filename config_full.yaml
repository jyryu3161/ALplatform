# Complete schema. Paths resolve relative to this file. Real Vina replay scores.
# data.path may also be a library store directory built with `prepare-library`.
schema_version: 1
seed: 42
mode: replay
output_dir: results/full
resources:
  cpu_threads: 8
  gpu_ids:
  - 0
  - 1
  device: cpu
  deterministic: true
data:
  path: examples/data/docking_scores.csv
  id_column: Catalog ID
  smiles_column: smiles
  score_column: docking_score
  invalid_policy: error
  deduplicate: true
  fingerprint_type: morgan
  fingerprint_radius: 2
  fingerprint_bits: 2048
model:
  models: [tabm]
  ensemble:
    strategy: mean  # mean | weighted | validation (inverse acquired-validation MSE)
    weights: null  # weighted only, in models order; e.g. [0.5, 0.3, 0.2]
  params: {}  # Per-model options, e.g. {nori: {model: nori-6m, max_features: 128}}
  n_blocks: 3
  d_block: 128
  k: 16
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.0003
  epochs: 100
  batch_size: 128
  patience: 10
  validation_fraction: 0.2
  auto_tune: false
  tuning_method: random
  n_trials: 10
  inference_batch_size: null
learning:
  initial_size: 8
  batch_size: 4
  cycles: 4
  budget: 24
  strategy: lcb
  beta: 1.0
  beta_schedule: constant
  beta_final: null
evaluation:
  holdout_fraction: 0.2
  split: random
  top_k: 4
  save_predictions: true
docking:
  backend: vina
  receptor: null
  reference_ligand: null
  center: null
  box_size:
  - 22.0
  - 22.0
  - 22.0
  executable: null
  exhaustiveness: 8
  n_poses: 3
  conformers: 1
  timeout: 300.0
  cpu: 1
  workers: 1
