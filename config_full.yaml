# Complete schema. Paths resolve relative to this file. Real Vina replay scores.
# data.path may also be a library store directory built with `prepare-library`.
schema_version: 1
seed: 42
mode: replay
output_dir: results/full
resources:
  cpu_threads: 8
  gpu_ids:
  - 0
  - 1
  device: cpu
  deterministic: true
data:
  path: examples/data/docking_scores.csv
  id_column: Catalog ID
  smiles_column: smiles
  score_column: docking_score
  invalid_policy: error
  deduplicate: true
  fingerprint_type: morgan
  fingerprint_radius: 2
  fingerprint_bits: 2048
model:
  models: [tabpfn]  # default; tabm, random_forest, extra_trees, nori, tabldm, tabfm, or a list (ensemble)
  ensemble:
    strategy: mean  # mean | weighted | validation (inverse acquired-validation MSE)
    weights: null  # weighted only, in models order; e.g. [0.5, 0.3, 0.2]
  params:  # Per-model options for selected models only, e.g. nori: {model: nori-6m, max_features: 128}
    # tabpfn model_path: a local tabpfn-v2-regressor.ckpt; null downloads the pinned public checkpoint.
    tabpfn: {max_features: 500, max_context_samples: 10000, n_estimators: 8, model_path: null}
  # TabM only: n_blocks, d_block, k, dropout, learning_rate, weight_decay, epochs, patience, auto_tune,
  # tuning_method, n_trials. Values other than these defaults require tabm in models.
  # batch_size, validation_fraction and inference_batch_size are shared by all models.
  n_blocks: 3
  d_block: 128
  k: 16
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.0003
  epochs: 100
  batch_size: 128
  patience: 10
  validation_fraction: 0.2
  auto_tune: false
  tuning_method: random
  n_trials: 10
  inference_batch_size: null
learning:
  initial_size: 8
  batch_size: 4
  cycles: 4
  budget: 24
  strategy: lcb
  beta: 1.0
  beta_schedule: constant
  beta_final: null
evaluation:
  holdout_fraction: 0.2
  split: random
  top_k: 4
  save_predictions: true
docking:
  backend: vina
  receptor: null
  reference_ligand: null
  center: null
  box_size:
  - 22.0
  - 22.0
  - 22.0
  executable: null
  exhaustiveness: 8
  n_poses: 3
  conformers: 1
  timeout: 300.0
  cpu: 1
  workers: 1
  rescoring: none  # none | gnina (GNINA CNNaffinity rescoring of each best pose; mode: docking only)
  gnina_image: null  # gnina only: GNINA Apptainer SIF image path; must be null with rescoring: none
  apptainer_executable: null  # gnina only: Apptainer executable path (PATH is not searched)
